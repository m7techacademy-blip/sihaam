<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banadir School Results - Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            color: white;
            text-align: center;
            overflow-x: hidden;

            /* ============ BACKGROUND: ORANGE + DARK BLUE ============ */
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #ff6b00, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= LOGIN SCREEN ================= */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .login-box {
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 0, 0.6);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.4);
            width: 320px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-box h2 {
            color: #ff8c33;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 2px solid rgba(255, 107, 0, 0.4);
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .login-box input:focus {
            border-color: #ff8c33;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 12px rgba(255, 107, 0, 0.5);
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #ff6b00, #0f3460);
            color: white;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
        }

        .login-box button:hover {
            background: linear-gradient(90deg, #0f3460, #ff6b00);
            transform: scale(1.03);
            box-shadow: 0 0 18px rgba(255, 107, 0, 0.7);
        }

        #errorMsg {
            color: #ff5555;
            font-size: 14px;
            margin-top: 10px;
            min-height: 18px;
            font-weight: bold;
        }

        /* ================= MAIN PAGE ================= */
        #mainPage {
            display: none;
            position: relative;
            z-index: 1;
            padding-bottom: 40px;
        }

        h1 { color: #ffb366; text-shadow: 0 0 10px rgba(255,107,0,0.6); }
        h2 { color: #66d9ff; text-shadow: 0 0 10px rgba(102,217,255,0.5); }

        h3 {
            margin: 0;
            padding-left: 65px;
            font-size: 28px;
            color: white;
        }

        h4 img {
            width: 108px;
            height: 120px;
            border-radius: 10px;
            margin: 20px auto 0;
            display: block;
            animation: rotateimg 1s linear infinite alternate;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
        }

        @keyframes rotateimg {
            from { transform: rotate(-5deg); }
            to   { transform: rotate(5deg); }
        }

        .header {
            background: linear-gradient(90deg, #ff6b00, #0f3460);
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo {
            width: 80px;
            height: 70px;
            position: absolute;
            left: 10px;
            animation: rotateLogo 3s infinite alternate;
        }

        @keyframes rotateLogo {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.95);
            color: #0f3460;
            box-shadow: 0px 0px 20px rgba(255, 107, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(90deg, #ff6b00, #0f3460);
            color: white;
            padding: 12px;
            border: 1px solid #0f3460;
        }

        td {
            padding: 10px;
            border: 1px solid #0f3460;
        }

        tr:hover {
            background: linear-gradient(90deg, #ff6b00, #0f3460);
            color: white;
        }

        .footer {
            margin-top: 20px;
            background: linear-gradient(90deg, #0f3460, #ff6b00);
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        button {
            margin: 10px 5px 0;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b00, #0f3460);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #0f3460, #ff6b00);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.7);
        }

        /* ================= PRINT ================= */
        @media print {
            button { display: none; }
            #loginScreen { display: none !important; }
            body { background: white; color: black; animation: none; }
            .header, .footer { background: white; color: black; }
            th { background: #ddd; color: black; }
        }

        /* ================= MOBILE ================= */
        @media (max-width: 768px) {
            .header { font-size: 16px; padding: 15px; }
            .logo { width: 60px; height: 50px; }
            table { width: 100%; }
            th, td { font-size: 14px; padding: 8px; }
            h3 { font-size: 22px; }
            .login-box { width: 90%; }
        }
    </style>
</head>
<body onload="calculateGPA()">

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>🔐 Login</h2>
            <input type="password" id="password" placeholder="Password" autocomplete="off">
            <button onclick="login()">Gal</button>
            <div id="errorMsg"></div>
        </div>
    </div>

    <!-- ================= MAIN PAGE ================= -->
    <div id="mainPage">
        <div class="header">
            <img src="M7 LOGO.png" class="logo" alt="School Logo">
            <h3>M7 TECH ACADEMY</h3>
        </div>

        <h4><img src="Sihaam.jpeg" alt="waa la hubina"></h4>
        <h1>Siham Alas Hussein</h1>
        <h2>ID No. 00304</h2>

        <table id="resultsTable">
            <tr>
                <th>No.</th>
                <th>Maadada</th>
                <th>Buuntada</th>
                <th>Darajo</th>
                <th>Fasalka</th>
            </tr>
            <tr><td>1</td><td>WINDOW 10</td><td>        92.8          </td><td>A</td><td>COMPUTER</td></tr>
            <tr><td>2</td><td>MS-WORD</td><td>          0          </td><td>Z</td><td>COMPUTER</td></tr>
            <tr><td>3</td><td>M-S EXCEL</td><td>        0          </td><td>Z</td><td>COMPUTER</td></tr>
            <tr><td>4</td><td>M-S POWER POINT</td><td>  0          </td><td>Z</td><td>COMPUTER</td></tr>
        </table>

        <div class="footer">
            GPA: <span id="gpa">0</span>
            <br> Average: <span id="average">0%</span>
            <br>Ardaygani wuu: <span id="status">Pending</span>
        </div>

        <button onclick="printResults()">Print</button>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        // ================= LOGIN =================
        const PASSWORD = "M7 00304";

        function login() {
            const pwd = document.getElementById("password").value;

            if (pwd === PASSWORD) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("mainPage").style.display = "block";
            } else {
                document.getElementById("errorMsg").innerText = "❌ Password-ka waa khalad!";
                document.getElementById("password").value = "";
            }
        }

        function logout() {
            document.getElementById("mainPage").style.display = "none";
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("password").value = "";
            document.getElementById("errorMsg").innerText = "";
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && document.getElementById("loginScreen").style.display !== "none") {
                login();
            }
        });

        // ================= GPA =================
        function calculateGPA() {
            let table = document.getElementById("resultsTable");
            let totalPoints = 0, subjects = 0, gpaTotal = 0;

            for (let i = 1; i < table.rows.length; i++) {
                let points = parseInt(table.rows[i].cells[2].innerText);
                if (!isNaN(points)) {
                    totalPoints += points;
                    subjects++;
                    gpaTotal += points / 20;
                }
            }

            if (subjects === 0) {
                document.getElementById("gpa").innerText = "N/A";
                document.getElementById("average").innerText = "N/A";
                document.getElementById("status").innerText = "No data";
                return;
            }

            let average = (totalPoints / subjects).toFixed(2);
            let gpa = (gpaTotal / subjects).toFixed(2);

            document.getElementById("gpa").innerText = gpa;
            document.getElementById("average").innerText = average + "%";
            document.getElementById("status").innerText = gpa >= 1.0 ? "Baasay" : "Failed";
        }

        function printResults() {
            window.print();
        }
    </script>
</body>
</html>
